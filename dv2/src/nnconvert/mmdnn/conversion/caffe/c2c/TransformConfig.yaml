Limit:
  standardize_patching:
    - 20
  layer_specific_passes:
    - 100
  common_passes:
    - 45
  name_patching:
    - 3
  pattern_matchers:
    - 3
  target_patching:
    - 10
Ignore:
  Ara1:
    - None
  Ara2:
    - Ara1
    - HtoWforSoftmax
  TFlite:
    - Ara2
    - Ara1
Patching:
