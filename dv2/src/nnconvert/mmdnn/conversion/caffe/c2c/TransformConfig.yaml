    # - unet_patterns, RemoveRedundantPermuteAttention
    - remove_redundant_layers, yolov8_reshape_concat_split
    - remove_redundant_layers, yolov8_concat_slice_reshape
  FinalPatchings:
    - batchdot, GeGLuSplit_1
    - batchdot, GeGLuSplit_2
    - batchdot, GeGLuSplit_3
