    - h_to_w, HtoWforBatchNorm
    # - batchdot, MultiHeadAttentionSplit_LLM
    - convolution, SliceConvolution1
    - convolution, SliceConvolution2
    - batchdot, UnetPattern2_2
    - eltwise, Eltwise_bc3bc0_to_bc0bc3
    - activation, ActivationPatching
    - layer_fusion, ReorderLayersForFusion
    - reshape, FuseReshape
    - remove_noop_layers, RemoveNoopReshape
    - permute, FusePermute
    # - permute, FusePermuteNnp
    - permute, PermuteNnp
    - aten, ATenPatching
    - cast, DVCastPatching
    - dvtensor, DVTensorShiftPatching
    - dvtensor, DVTensorCastPatching
    - shift, DVShiftSplit
