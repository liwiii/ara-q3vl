    other:
      - remove_redundant_layers, RemoveRedundantLayers
      - remove_noop_layers, RemoveNoopSoftmax
    RedundantAdd:
      - eltwise, ZeroAdd
    Aten:
      - aten, powToMul
  NamePatchings:
    - reduce, NamePatching
  TargetPatchings:
    # - dvtensor, DynamicDvtensorPatching
    - tf2onnx, OutputPermuteRemoval
    - tf2onnx, HandleLastPermuteReshape
    - target, TargetType
    - group, GroupPatching
    - shape, ShapePatching
  Standardize:
    - standardize_blobs, UniquifyBlobNames
    - standardize_padding, StandardizePad
    - standardize_padding, StandardizeStrides
    - standardize_padding, StandardizeKernelSize
Fuse_act:
    dryrun_0:
      - False
    dryrun_1:
      - True
    dryrun_2:
      - False
