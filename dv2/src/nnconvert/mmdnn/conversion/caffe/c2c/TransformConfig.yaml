    Eltwise:
      - eltwise, EltwisePatching
      - eltwise, BroadcastEltwisePatching
      - eltwise, EltwiseBroadcastPatching
      - eltwise, EltwiseConstantPatching
      - eltwise, Eltwise_bc2bc0_to_bc0bc2
    Upsample_Scale:
      - upsample, UpsampleScale
    LinearUpsample:
      - linearUpsample, LinearUpsample
    BroadcastMul:
      - broadcastmul, BroadcastMulPatching
    Broadcast:
      - broadcast, BroadcastPatching
    Identity:
      - identity, IdentityPatching
    DynamicInput:
      - dynamic_input, DynamicInputPatching
    BatchLoop:
      - batchloop, BatchLoopPatching
    CropPatching:
      - crop, CropPatching
    Pad:
      - pad_fusion, FusePadIntoSuccessor
      - remove_noop_layers, RemoveNoopPad
      - squash_consecutive_layers, SquashConsecutivePads
    AvgPool:
      - remove_noop_layers, RemoveNoopAvgPool
    Pool:
      - remove_noop_layers, RemoveNoopPool
    Crop:
      - remove_noop_layers, RemoveNoopCrop
      - squash_consecutive_layers, SquashConsecutiveCrops
    Permute:
      - permute, PermuteForSpacialDist
      - permute, FusePermute
      - squash_consecutive_layers, SquashConsecutiveCrops
      - dvtensor, DVTensorPermutePatching
      - remove_redundant_layers, RemoveReshapePermutes
      - remove_redundant_layers, PermuteReshapePermute
      - remove_redundant_layers, RemoveRedundantPermutes
      - permute, RemoveRedundantPermute1
      - permute, PermuteForHW
      - permute, PermuteLarge
      - permute, PermuteToReshape
      - batchdot, BDotPermPattern1
      - batchdot, BDotPermPattern2
      - batchdot, BDotPermPattern3
      - batchdot, BDotPermPattern4
      - Ara2batchdot, Ara2BatchDotPatching
      - softmax, SoftmaxPermuteAxis2to1_1
      - softmax, SoftmaxPermuteAxis2to1_2
    PermuteNnp:
