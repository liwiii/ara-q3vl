      - remove_redundant_layers, RemoveReshapePermutes
      - remove_redundant_layers, PermuteReshapePermute
      - reshape, FuseReshape
      - rearrange_layers, Bnorm_Reshape_Scale
    DetectionOutput:
      - detection_out, DetectionOutPatching
    Mxnet_Take:
